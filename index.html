<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소리로 듣는 사인파</title>
<style>
:root{
  --bg:#EEF2F4;--panel:#FFFFFF;--ink:#12222B;--muted:#53666F;--line:#D3DCE1;--accent:#0E6BA8;--accent-ink:#FFFFFF;
  --scope:#0A1218;--grid:#1E3340;--axis:#2F4B5C;--trace:#5EF0C8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0C1419;--panel:#142029;--ink:#E6EEF2;--muted:#9AAEB9;--line:#263642;--accent:#4DB3E6;--accent-ink:#06202E;}
}
:root[data-theme="dark"]{--bg:#0C1419;--panel:#142029;--ink:#E6EEF2;--muted:#9AAEB9;--line:#263642;--accent:#4DB3E6;--accent-ink:#06202E;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.55;}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px;}
h1{font-size:1.5rem;margin:4px 0 6px;letter-spacing:-.01em;}
.lead{margin:0 0 16px;color:var(--muted);}
.scope-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
canvas{display:block;width:100%;aspect-ratio:2/1;background:var(--scope);}
.ax{position:absolute;bottom:6px;font-size:.75rem;color:#8FB0C2;}
.ax.l{left:8px}.ax.r{right:8px}
.formula{margin:10px 0 14px;font-size:.95rem;color:var(--muted);overflow-x:auto;white-space:nowrap;}
.seg{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;}
.seg button{flex:1;padding:10px 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;margin-bottom:14px;}
.row{padding:10px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:0;}
.row label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem;}
.row label small{font-weight:400;color:var(--muted);}
.row output{font-variant-numeric:tabular-nums;color:var(--accent);}
input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--accent);height:28px;}
.presets{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;}
.presets button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;}
.play{width:100%;padding:16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;}
.play[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:3px;}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.note{margin:14px 0 0;font-size:.875rem;color:var(--muted);}
.note p{margin:0 0 6px;}
[hidden]{display:none !important;}
</style>
</head>
<body>
<main>
  <h1>소리로 듣는 사인파</h1>
  <p class="lead">슬라이더로 값을 바꾸고 재생을 누르면 그래프와 같은 소리가 납니다.</p>

  <div class="scope-wrap">
    <canvas id="scope" role="img" aria-label="사인파 그래프"></canvas>
    <span class="ax l">0</span><span class="ax r">10 ms</span>
  </div>
  <p class="formula" id="formula"></p>

  <div class="seg" role="group" aria-label="모드 선택">
    <button id="m1" aria-pressed="true">사인파 하나</button>
    <button id="m2" aria-pressed="false">음색 만들기</button>
  </div>

  <div class="panel">
    <div id="p1">
      <div class="row">
        <label for="A"><span>진폭 A <small>소리의 세기</small></span><output id="Av"></output></label>
        <input id="A" type="range" min="0" max="1" step="0.05" value="0.5">
      </div>
    </div>
    <div id="p2" hidden>
      <div class="row">
        <label for="a1"><span>a₁ <small>기본음의 크기</small></span><output id="a1v"></output></label>
        <input id="a1" type="range" min="0" max="1" step="0.1" value="1">
      </div>
      <div class="row">
        <label for="a2"><span>a₂ <small>2배음의 크기</small></span><output id="a2v"></output></label>
        <input id="a2" type="range" min="0" max="1" step="0.1" value="0.5">
      </div>
      <div class="row">
        <label for="a3"><span>a₃ <small>3배음의 크기</small></span><output id="a3v"></output></label>
        <input id="a3" type="range" min="0" max="1" step="0.1" value="0.3">
      </div>
    </div>
    <div class="row">
      <label for="f"><span id="flabel">주파수 f <small>소리의 높낮이</small></span><output id="fv"></output></label>
      <input id="f" type="range" min="100" max="1000" step="10" value="440">
    </div>
    <div class="presets" aria-label="주파수 바로 선택">
      <button data-f="220">낮은 소리 220 Hz</button>
      <button data-f="440">중간 소리 440 Hz</button>
      <button data-f="880">높은 소리 880 Hz</button>
    </div>
  </div>

  <button id="play" class="play" aria-pressed="false">재생</button>

  <div class="note">
    <p>Desmos 화면에서는 그래프가 잘 보이도록 f를 1~5로 줄여 썼습니다. 실제 소리의 주파수는 수백 Hz입니다.</p>
    <p>소리가 나지 않으면 기기 음량과 무음 모드를 확인하세요. 이어폰을 쓰면 더 잘 들립니다.</p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const S = {A:0.5, f:440, a1:1, a2:0.5, a3:0.3};
let mode = 'simple', ctx = null, master = null, oscs = [], gains = [], playing = false;
const sub = ['₁','₂','₃'];

function amps(){ return mode === 'simple' ? [S.A,0,0] : [S.a1,S.a2,S.a3]; }

function labels(){
  $('Av').textContent = S.A.toFixed(2);
  $('a1v').textContent = S.a1.toFixed(1);
  $('a2v').textContent = S.a2.toFixed(1);
  $('a3v').textContent = S.a3.toFixed(1);
  $('fv').textContent = S.f + ' Hz';
  $('flabel').innerHTML = mode === 'simple' ? '주파수 f <small>소리의 높낮이</small>' : '기본음 주파수 f₀ <small>소리의 높낮이</small>';
  $('formula').textContent = mode === 'simple'
    ? 'y = A sin(2π f t)'
    : 'y = a₁ sin(2π f₀ t) + a₂ sin(2π·2f₀ t) + a₃ sin(2π·3f₀ t)';
}

function draw(){
  const c = $('scope'), r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const w = Math.round(r.width * d), h = Math.round(r.height * d);
  if (!w || !h) return;
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  const g = c.getContext('2d'), cs = getComputedStyle(document.documentElement);
  g.fillStyle = cs.getPropertyValue('--scope').trim(); g.fillRect(0,0,w,h);
  g.strokeStyle = cs.getPropertyValue('--grid').trim(); g.lineWidth = d; g.beginPath();
  for (let i=1;i<10;i++){ const x = w*i/10; g.moveTo(x,0); g.lineTo(x,h); }
  for (let j=1;j<4;j++){ const y = h*j/4; g.moveTo(0,y); g.lineTo(w,y); }
  g.stroke();
  g.strokeStyle = cs.getPropertyValue('--axis').trim(); g.lineWidth = 1.5*d; g.beginPath();
  g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  const a = amps(), ymax = mode === 'simple' ? 1.1 : Math.max(1.1, (a[0]+a[1]+a[2])*1.1);
  g.strokeStyle = cs.getPropertyValue('--trace').trim(); g.lineWidth = 2.5*d; g.lineJoin = 'round'; g.beginPath();
  for (let x=0;x<=w;x++){
    const t = x/w*0.01; let y = 0;
    for (let i=0;i<3;i++) y += a[i]*Math.sin(2*Math.PI*S.f*(i+1)*t);
    const py = h/2 - y/ymax*(h/2);
    if (x) g.lineTo(x,py); else g.moveTo(x,py);
  }
  g.stroke();
}

function refresh(){
  labels(); draw();
  if (playing){
    const t = ctx.currentTime, a = amps();
    oscs.forEach((o,i)=>{ o.frequency.setTargetAtTime(S.f*(i+1), t, 0.03); gains[i].gain.setTargetAtTime(a[i], t, 0.03); });
  }
}

function start(){
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
  const a = amps(); oscs = []; gains = [];
  for (let i=0;i<3;i++){
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = S.f*(i+1);
    const g = ctx.createGain(); g.gain.value = a[i];
    o.connect(g); g.connect(master); o.start(); oscs.push(o); gains.push(g);
  }
  master.gain.setTargetAtTime(0.2, ctx.currentTime, 0.02);
  playing = true;
}

function stop(){
  const t = ctx.currentTime, os = oscs, m = master;
  m.gain.setTargetAtTime(0, t, 0.03);
  setTimeout(()=>{ os.forEach(o=>{ try{o.stop();}catch(e){} }); m.disconnect(); }, 200);
  playing = false;
}

$('play').addEventListener('click', ()=>{
  if (playing) stop(); else start();
  $('play').setAttribute('aria-pressed', String(playing));
  $('play').textContent = playing ? '정지' : '재생';
});

['A','f','a1','a2','a3'].forEach(k=>{
  $(k).addEventListener('input', e=>{ S[k] = parseFloat(e.target.value); refresh(); });
});

document.querySelectorAll('.presets button').forEach(b=>{
  b.addEventListener('click', ()=>{ S.f = +b.dataset.f; $('f').value = S.f; refresh(); });
});

function setMode(m){
  mode = m;
  $('m1').setAttribute('aria-pressed', String(m==='simple'));
  $('m2').setAttribute('aria-pressed', String(m==='synth'));
  $('p1').hidden = m !== 'simple'; $('p2').hidden = m !== 'synth';
  refresh();
}
$('m1').addEventListener('click', ()=>setMode('simple'));
$('m2').addEventListener('click', ()=>setMode('synth'));

window.addEventListener('resize', draw);
labels(); draw();
</script>
</body>
</html>
